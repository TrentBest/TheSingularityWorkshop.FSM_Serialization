name: Verify

on:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore TheSingularityWorkshop.FSM_Serialization.slnx

      - name: Build
        run: dotnet build TheSingularityWorkshop.FSM_Serialization.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test TheSingularityWorkshop.FSM_Serialization.slnx --configuration Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack TheSingularityWorkshop.FSM_Serialization.csproj --configuration Release --no-build --output ./artifacts

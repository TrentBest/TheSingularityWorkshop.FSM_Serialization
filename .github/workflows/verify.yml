name: Verify

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore TheSingularityWorkshop.FSM_Serialization.slnx

      - name: Build
        run: dotnet build TheSingularityWorkshop.FSM_Serialization.slnx --configuration Release --no-restore

      - name: Test with coverage
        run: >
          dotnet test TheSingularityWorkshop.FSM_Serialization.slnx
          --configuration Release
          --no-build
          --verbosity normal
          --collect:"XPlat Code Coverage;Format=cobertura"
          --results-directory ./TestResults
          --logger "trx;LogFileName=testresults.trx"

      - name: Locate coverage report
        shell: bash
        run: |
          set -euo pipefail
          coverage_file="$(find ./TestResults -name 'coverage.cobertura.xml' -type f | head -n 1)"
          if [[ -z "$coverage_file" ]]; then
            echo "Coverage report was not generated."
            exit 1
          fi
          cp "$coverage_file" ./TestResults/coverage.cobertura.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: TrentBest/TheSingularityWorkshop.FSM_Serialization
          files: ./TestResults/coverage.cobertura.xml
          fail_ci_if_error: true

      - name: Pack
        run: dotnet pack TheSingularityWorkshop.FSM_Serialization.csproj --configuration Release --no-build --output ./artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: fsm-serialization-package
          path: ./artifacts/*

      - name: Upload test and coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fsm-serialization-test-results
          path: ./TestResults/*

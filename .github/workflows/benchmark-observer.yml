name: Notify serialization benchmark observer

on:
  push:
    branches: [development]

permissions:
  contents: read

jobs:
  dispatch-benchmarks:
    name: Request source-commit benchmark
    runs-on: ubuntu-latest
    if: ${{ secrets.BENCHMARKS_DISPATCH_TOKEN != '' }}
    steps:
      - name: Dispatch exact source commit to benchmark repository
        env:
          GH_TOKEN: ${{ secrets.BENCHMARKS_DISPATCH_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(printf '{"event_type":"serialization-development-changed","client_payload":{"source_sha":"%s","source_ref":"%s"}}' "$SOURCE_SHA" "$SOURCE_REF")"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/TrentBest/FSM_Serialization_Benchmarks/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "$payload"

      - name: Explain missing cross-repository token
        if: ${{ secrets.BENCHMARKS_DISPATCH_TOKEN == '' }}
        run: echo "Set BENCHMARKS_DISPATCH_TOKEN in this repository's Actions secrets to enable automatic benchmark dispatch."

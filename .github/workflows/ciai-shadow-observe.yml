name: CiAi Shadow Observation

on:
  push:
    branches: [development]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact FSM_Serialization commit SHA to observe
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ciai-shadow-${{ inputs.source_sha || github.sha }}
  cancel-in-progress: false

jobs:
  observe:
    name: Observe completed baseline run without replacing its gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Resolve candidate SHA
        id: candidate
        shell: bash
        env:
          INPUT_SHA: ${{ inputs.source_sha || '' }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sha="$INPUT_SHA"
          if [[ -z "$sha" ]]; then sha="$PUSH_SHA"; fi
          if [[ ! "$sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Candidate must be a full 40-character commit SHA."
            exit 1
          fi
          echo "sha=${sha,,}" >> "$GITHUB_OUTPUT"

      - name: Checkout CiAi observer and policy evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: TrentBest/TheSingularityWorkshop.CiAi
          ref: development
          path: ciai
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x

      - name: Validate exact baseline workflow run
        id: baseline
        shell: bash
        env:
          TARGET_SHA: ${{ steps.candidate.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/TrentBest/TheSingularityWorkshop.FSM_Serialization/actions/workflows/build.yml/runs?branch=development&head_sha=$TARGET_SHA&per_page=100"
          headers=(-H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -H "Authorization: Bearer $GH_TOKEN")
          run=""
          for attempt in $(seq 1 80); do
            response="$(curl --fail-with-body --silent --show-error "${headers[@]}" "$api")"
            matches="$(jq -c --arg sha "$TARGET_SHA" '
              [.workflow_runs[]
                | select(.event == "push" and .head_branch == "development")
                | select((.head_sha | ascii_downcase) == ($sha | ascii_downcase))
                | select((.path | split("@")[0]) == ".github/workflows/build.yml")]
            ' <<< "$response")"
            count="$(jq 'length' <<< "$matches")"
            if (( count > 1 )); then
              echo "::error::Ambiguous baseline workflow evidence: $count runs match the exact source SHA."
              exit 1
            fi
            if (( count == 1 )); then
              candidate="$(jq -c '.[0]' <<< "$matches")"
              status="$(jq -r '.status // empty' <<< "$candidate")"
              if [[ "$status" == "completed" ]]; then
                run="$candidate"
                break
              fi
            fi
            echo "Waiting for the exact-SHA baseline workflow to complete (poll $attempt/80)."
            sleep 15
          done
          if [[ -z "$run" ]]; then
            echo "::error::No unique completed baseline workflow run was observed for $TARGET_SHA within 20 minutes."
            exit 1
          fi
          run_id="$(jq -r '.id // 0' <<< "$run")"
          run_attempt="$(jq -r '.run_attempt // 0' <<< "$run")"
          if [[ ! "$run_id" =~ ^[1-9][0-9]*$ || ! "$run_attempt" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Baseline run/attempt identity is invalid."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$run_attempt" >> "$GITHUB_OUTPUT"
          echo "conclusion=$(jq -r '.conclusion // empty' <<< "$run")" >> "$GITHUB_OUTPUT"
          echo "run_url=$(jq -r '.html_url // empty' <<< "$run")" >> "$GITHUB_OUTPUT"
          echo "Baseline run $run_id attempt $run_attempt concluded $(jq -r '.conclusion // "unknown"' <<< "$run")."

      - name: Restore CiAi observer
        working-directory: ciai
        run: dotnet restore samples/TheSingularityWorkshop.CiAi.ObserveRun/TheSingularityWorkshop.CiAi.ObserveRun.csproj

      - name: Build CiAi observer
        working-directory: ciai
        run: dotnet build samples/TheSingularityWorkshop.CiAi.ObserveRun/TheSingularityWorkshop.CiAi.ObserveRun.csproj --configuration Release --no-restore

      - name: Observe exact completed source workflow and evaluate required identity
        working-directory: ciai
        shell: bash
        env:
          TARGET_REPOSITORY: TrentBest/TheSingularityWorkshop.FSM_Serialization
          TARGET_SHA: ${{ steps.candidate.outputs.sha }}
          TARGET_RUN_ID: ${{ steps.baseline.outputs.run_id }}
          TARGET_RUN_ATTEMPT: ${{ steps.baseline.outputs.run_attempt }}
          CIAI_GITHUB_TOKEN: ${{ github.token }}
          CIAI_REQUIRED_WORKFLOW_PATHS: .github/workflows/build.yml#${{ steps.baseline.outputs.run_id }}#${{ steps.baseline.outputs.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          evaluator_sha="$(git -C . rev-parse HEAD)"
          # A policy failure is valid evidence, not a reason to skip provenance.
          # Preserve the observer's exit code and return it only after provenance is written.
          set +e
          dotnet run --project samples/TheSingularityWorkshop.CiAi.ObserveRun --configuration Release --no-build -- "$TARGET_REPOSITORY" "$TARGET_SHA" artifacts/commit-observation.json
          observer_exit_code=$?
          set -e
          case "$observer_exit_code" in
            0) observer_outcome="passing" ;;
            3) observer_outcome="policy-nonpassing" ;;
            *) observer_outcome="observer-error" ;;
          esac
          jq -n \
            --arg sourceRepository "$TARGET_REPOSITORY" \
            --arg sourceSha "$TARGET_SHA" \
            --arg baselineRunId "$TARGET_RUN_ID" \
            --arg baselineRunAttempt "$TARGET_RUN_ATTEMPT" \
            --arg baselineConclusion "${{ steps.baseline.outputs.conclusion }}" \
            --arg baselineUrl "${{ steps.baseline.outputs.run_url }}" \
            --arg ciaiRepository "TrentBest/TheSingularityWorkshop.CiAi" \
            --arg ciaiEvaluatorSha "$evaluator_sha" \
            --arg shadowRunId "${{ github.run_id }}" \
            --arg shadowRunAttempt "${{ github.run_attempt }}" \
            --arg observerExitCode "$observer_exit_code" \
            --arg observerOutcome "$observer_outcome" \
            '{schema:"ciai.serialization-shadow-host.v2",sourceRepository:$sourceRepository,sourceSha:$sourceSha,baselineRunId:($baselineRunId|tonumber),baselineRunAttempt:($baselineRunAttempt|tonumber),baselineConclusion:$baselineConclusion,baselineUrl:$baselineUrl,ciaiRepository:$ciaiRepository,ciaiEvaluatorSha:$ciaiEvaluatorSha,shadowRunId:($shadowRunId|tonumber),shadowRunAttempt:($shadowRunAttempt|tonumber),observerExitCode:($observerExitCode|tonumber),observerOutcome:$observerOutcome,mode:"shadow-only",publicationAuthorized:false}' \
            > artifacts/shadow-host-provenance.json
          exit "$observer_exit_code"

      - name: Upload raw shadow evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ciai-shadow-fsm-serialization-${{ steps.candidate.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ciai/artifacts/commit-observation.json
            ciai/artifacts/commit-observation.md
            ciai/artifacts/shadow-host-provenance.json
          if-no-files-found: warn
          retention-days: 90

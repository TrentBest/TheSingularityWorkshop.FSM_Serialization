name: CiAi Shadow Observation

on:
  workflow_run:
    workflows: ["Package FSM Serialization"]
    types: [completed]
    branches: [development]

permissions:
  contents: read
  actions: read

concurrency:
  group: ciai-shadow-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  observe:
    name: Observe completed baseline run without replacing its gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout CiAi observer and policy evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: TrentBest/TheSingularityWorkshop.CiAi
          ref: development
          path: ciai
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x

      - name: Validate workflow-run identity
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ github.event.workflow_run.repository.full_name }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REPOSITORY" == "TrentBest/TheSingularityWorkshop.FSM_Serialization" ]]
          [[ "$SOURCE_BRANCH" == "development" ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]

      - name: Restore CiAi observer
        working-directory: ciai
        run: dotnet restore samples/TheSingularityWorkshop.CiAi.ObserveRun/TheSingularityWorkshop.CiAi.ObserveRun.csproj

      - name: Build CiAi observer
        working-directory: ciai
        run: dotnet build samples/TheSingularityWorkshop.CiAi.ObserveRun/TheSingularityWorkshop.CiAi.ObserveRun.csproj --configuration Release --no-restore

      - name: Observe exact completed source workflow and evaluate required identity
        working-directory: ciai
        shell: bash
        env:
          TARGET_REPOSITORY: ${{ github.event.workflow_run.repository.full_name }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          TARGET_RUN_ID: ${{ github.event.workflow_run.id }}
          TARGET_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          CIAI_GITHUB_TOKEN: ${{ github.token }}
          CIAI_REQUIRED_WORKFLOW_PATHS: .github/workflows/build.yml#${{ github.event.workflow_run.id }}#${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          dotnet run --project samples/TheSingularityWorkshop.CiAi.ObserveRun --configuration Release --no-build -- "$TARGET_REPOSITORY" "$TARGET_SHA" artifacts/commit-observation.json

      - name: Upload raw shadow evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ciai-shadow-fsm-serialization-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: |
            ciai/artifacts/commit-observation.json
            ciai/artifacts/commit-observation.md
          if-no-files-found: warn
          retention-days: 90

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Packing: domain state becomes bytes</title>
  <desc id="desc">An animated byte token travels from domain state through IBinaryPackable and IBinaryStream into a destination. The domain type owns the format.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101b31"/><stop offset="1" stop-color="#172b43"/></linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#53e2c2"/><stop offset="1" stop-color="#ffd166"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8ca8c9"/></marker>
  </defs>
  <rect width="960" height="430" rx="24" fill="url(#bg)"/>
  <text x="44" y="48" fill="#f4f7fb" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">PACK · meaning → bytes</text>
  <text x="44" y="75" fill="#a9bfd8" font-family="Segoe UI,Arial,sans-serif" font-size="14">The domain defines the format. The stream carries the representation.</text>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
    <rect x="42" y="128" width="190" height="112" rx="14" fill="#203d5a" stroke="#5d84ad" stroke-width="1.5"/>
    <text x="137" y="163" fill="#fff" font-size="17" font-weight="700">Domain state</text><text x="137" y="188" fill="#c9d9ea" font-size="13">Meaning + rules</text><text x="137" y="210" fill="#53e2c2" font-size="12">field order is owned here</text>
    <rect x="285" y="128" width="190" height="112" rx="14" fill="#203d5a" stroke="#5d84ad" stroke-width="1.5"/>
    <text x="380" y="163" fill="#fff" font-size="17" font-weight="700">IBinaryPackable</text><text x="380" y="188" fill="#c9d9ea" font-size="13">Pack(stream)</text><text x="380" y="210" fill="#53e2c2" font-size="12">explicit writer</text>
    <rect x="528" y="128" width="190" height="112" rx="14" fill="#203d5a" stroke="#5d84ad" stroke-width="1.5"/>
    <text x="623" y="163" fill="#fff" font-size="17" font-weight="700">IBinaryStream</text><text x="623" y="188" fill="#c9d9ea" font-size="13">Write(bytes)</text><text x="623" y="210" fill="#53e2c2" font-size="12">no schema inference</text>
    <rect x="771" y="128" width="147" height="112" rx="14" fill="#2b493f" stroke="#53e2c2" stroke-width="1.5"/>
    <text x="844" y="163" fill="#fff" font-size="17" font-weight="700">Destination</text><text x="844" y="188" fill="#d0eee5" font-size="13">Memory / .NET</text><text x="844" y="210" fill="#53e2c2" font-size="12">byte sequence</text>
  </g>
  <g fill="none" stroke="#8ca8c9" stroke-width="2" marker-end="url(#arrow)"><path d="M232 184 H277"/><path d="M475 184 H520"/><path d="M718 184 H763"/></g>
  <g fill="#ffd166" stroke="#fff1b8" stroke-width="1">
    <rect x="0" y="0" width="38" height="25" rx="5"><animateMotion dur="6s" repeatCount="indefinite" path="M250 171 L480 171 L720 171 L965 171"/></rect>
  </g>
  <text x="480" y="288" fill="#f4f7fb" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle">A representation is a contract, not a guess.</text>
  <g font-family="Consolas,monospace" font-size="15" text-anchor="middle">
    <rect x="230" y="316" width="78" height="38" rx="6" fill="#233c56" stroke="#7193b6"/><text x="269" y="340" fill="#f4f7fb">01</text>
    <rect x="316" y="316" width="78" height="38" rx="6" fill="#233c56" stroke="#7193b6"/><text x="355" y="340" fill="#f4f7fb">00</text>
    <rect x="402" y="316" width="78" height="38" rx="6" fill="#233c56" stroke="#7193b6"/><text x="441" y="340" fill="#f4f7fb">2A</text>
    <rect x="488" y="316" width="78" height="38" rx="6" fill="#233c56" stroke="#7193b6"/><text x="527" y="340" fill="#f4f7fb">00</text>
    <rect x="574" y="316" width="78" height="38" rx="6" fill="#233c56" stroke="#7193b6"/><text x="613" y="340" fill="#f4f7fb">...</text>
  </g>
  <text x="480" y="389" fill="#a9bfd8" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle">Illustrative byte cells only — actual layout is defined by the domain implementation.</text>
</svg>